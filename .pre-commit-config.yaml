repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-json
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Von Room generierte Schemas enthalten nur den identityHash des
        # Schemas, der als Hex-String fälschlich als Geheimnis erkannt wird.
        exclude: ^app/schemas/.*\.json$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-metaschema
        files: ^bestiarium/schema\.json$
      - id: check-jsonschema
        args: ["--schemafile=bestiarium/schema.json"]
        files: ^bestiarium/daten/.*\.json$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88"]

  - repo: local
    hooks:
      - id: validate-ruff-canon
        name: Validate Ruff bestiary references and values
        entry: python tools/validate_canon.py
        language: system
        pass_filenames: false
        files: ^bestiarium/daten/.*\.json$
