name: Ruff quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "init/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Test and validate Python tools
        run: |
          python -m unittest discover -s tools -v
          python tools/validate_canon.py

      - name: Check documentation links
        run: python tools/check_docs_links.py

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Build, run Android Lint, and lint Kotlin
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:ktlintCheck
